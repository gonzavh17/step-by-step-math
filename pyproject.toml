[project]
name = "step-by-step-math"
version = "0.1.0"
description = "MCP server that solves math step by step with a symbolic engine and renders each step on a visual whiteboard."
authors = [
    { name = "gonzavh17", email = "104873901+gonzavh17@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "starlette>=1.10",
    "sympy>=1.14",
    "uvicorn>=0.54",
]

license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
step-by-step-math = "step_by_step_math.server:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
